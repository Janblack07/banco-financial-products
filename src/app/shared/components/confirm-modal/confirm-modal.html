<div
  class="modal-backdrop"
  role="presentation"
  (click)="cancel()">

  <section
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
    (click)="$event.stopPropagation()">

    <div class="modal-body">
      <h2 id="modal-title">
        {{ title() }}
      </h2>

      <p>
        {{ message() }}
      </p>
    </div>

    <div class="modal-actions">

      <button
        type="button"
        class="cancel-button"
        [disabled]="loading()"
        (click)="cancel()">
        {{ cancelText() }}
      </button>

      <button
        type="button"
        class="confirm-button"
        [disabled]="loading()"
        (click)="confirm()">
        {{ loading() ? 'Eliminando...' : confirmText() }}
      </button>

    </div>

  </section>
</div>
