<div class="contextual-menu">
  <button
    #trigger
    type="button"
    class="contextual-menu__trigger"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-expanded]="opened()"
    aria-haspopup="menu"
    (click)="toggle($event)"
  >
    ⋮
  </button>

  @if (opened()) {
    <div
      class="contextual-menu__panel"
      role="menu"
      [style.top.px]="menuTop()"
      [style.left.px]="menuLeft()"
      (click)="$event.stopPropagation()"
    >
      <button
        type="button"
        role="menuitem"
        class="contextual-menu__option"
        (click)="onEdit($event)"
      >
        Editar
      </button>

      <button
        type="button"
        role="menuitem"
        class="contextual-menu__option contextual-menu__option--danger"
        (click)="onRemove($event)"
      >
        Eliminar
      </button>
    </div>
  }
</div>
